<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklists · MiroFish PRO</title>
<link rel="stylesheet" href="assets/tools.css"></head>
<body class="acc-a12 tool">
<div class="crumb"><a href="herramientas.html">← Herramientas</a></div>
<h1>✅ Checklists de la simulación</h1>
<p class="sub">Tres listas: antes de lanzar, en cada ronda y antes de entregar el informe. Se guardan en tu teléfono.</p>
<div id="app"></div>
<p class="foot">Ensayo, no profecía. Normas solo por su nombre: verificar la norma vigente y el expediente técnico aprobado.</p>
<script src="assets/catalog.js"></script><script src="assets/engine.js"></script><script src="assets/tools.js"></script>
<script>
(function () {
  var L = [
    { id: 'antes', t: '1. Antes de lanzar', items: [
      'El evento que dispara es UN hecho concreto e inyectable, con fecha.',
      'El dossier común tiene los seis bloques y cada cifra trae su documento de origen.',
      'Los puntos débiles visibles están escritos: sin ellos no hay conflicto.',
      'Elegí de 3 a 6 actores; cada uno decide, puede bloquear o tiene información.',
      'Cada perfil tiene los cinco campos y «lo que sabes y otros no» no está vacío.',
      'Lo no verificado en los documentos reales está marcado como hipótesis de simulación.',
      'Solo roles: nada de nombres de personas, DNI ni sueldos.',
      'Decidí qué hará el orquestador (y qué marcaré «resultado simulado»).',
      'El caso.json tiene actores, indicadores y plan de rondas.',
      'Sé qué pregunta quiero responder y para qué decisión me servirá.'] },
    { id: 'ronda', t: '2. En cada ronda', items: [
      'La consigna trae rutas ABSOLUTAS y solo los archivos permitidos para ese actor.',
      'La situación cuenta solo lo que ESE actor ve; nada de lo que no sabe.',
      'La decisión central es concreta (qué entregas el día 12, no «qué haces»).',
      'Formato exacto y tope de palabras; línea de indicadores con las mismas claves.',
      'Lancé todos los actores de la ronda en un mismo mensaje, en segundo plano.',
      'Revisé cada respuesta: ¿sigue en personaje, sin fabricar documentos ni artículos?',
      'Detecté fugas: ¿citó algo que solo otro actor sabía?',
      'Resolví con vista de dios: cronológico, fechado y con etiqueta de visibilidad.',
      'Lo de terceros (ensayos, asesoría, clima) va marcado «resultado simulado».',
      'Corrí armar_contextos y revisé que ningún actor activo quede sin novedades por error.'] },
    { id: 'informe', t: '3. Antes de entregar el informe', items: [
      'Responde en pocas líneas la pregunta simulada, sin vender predicción.',
      'La cronología y el gráfico de indicadores están; los indicadores se presentan como juicios declarados.',
      'Cada hallazgo indica qué actor lo vio y en qué ronda.',
      'Las recomendaciones tienen plazo y responsable (esta semana, dos semanas, hacia el cierre).',
      'Las limitaciones dicen: una sola corrida, supuestos del orquestador y resultados simulados.',
      'No promete resultado de valorización, adicional, ampliación, arbitraje ni control.',
      'Las normas van por su nombre, con «verificar la norma vigente y el expediente técnico aprobado».',
      'Lleva la leyenda de documento interno: no se manda a la Entidad ni al contratista.',
      'Anoté qué predijo cada actor para contrastarlo cuando ocurra.',
      'Guardé la corrida y la lección aprendida para mi biblioteca de casos.'] }
  ];
  var st = Store.get('chk', {});
  function draw() {
    var h = '';
    L.forEach(function (l) {
      var ok = 0; l.items.forEach(function (_, i) { if (st[l.id + i]) ok++; });
      h += '<div class="card"><div class="card-h"><h2>' + l.t + '</h2><span class="lead">' + ok + '/' + l.items.length + '</span></div><div class="bar"><i style="width:' + (100 * ok / l.items.length) + '%"></i></div>';
      l.items.forEach(function (t, i) {
        var k = l.id + i;
        h += '<label class="chk' + (st[k] ? ' on' : '') + '"><input type="checkbox" data-k="' + k + '"' + (st[k] ? ' checked' : '') + '><span>' + t + '</span></label>';
      });
      h += '<button class="btn sec" data-r="' + l.id + '">Reiniciar lista</button></div>';
    });
    document.getElementById('app').innerHTML = h;
    document.querySelectorAll('input[data-k]').forEach(function (c) { c.onchange = function () { st[c.getAttribute('data-k')] = c.checked; Store.set('chk', st); draw(); }; });
    document.querySelectorAll('button[data-r]').forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-r'); Object.keys(st).forEach(function (k) { if (k.indexOf(id) === 0) delete st[k]; }); Store.set('chk', st); draw(); }; });
  }
  draw();
})();
</script></body></html>
